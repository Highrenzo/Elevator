<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ascensore</title>

  <!-- Modalità app a schermo intero su iPhone/iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ascensore">
  <meta name="theme-color" content="#aeb3ba">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="panel">
    <!-- Display -->
    <section class="display" aria-live="polite">
      <div class="display__screen">
        <div class="display__arrow" id="arrow" data-dir="idle">
          <span></span><span></span><span></span>
        </div>
        <div class="display__floor" id="floor">T</div>
      </div>
    </section>

    <!-- Pulsantiera -->
    <section class="keypad" id="keypad" aria-label="Pulsantiera"></section>

    <!-- Targhetta decorativa -->
    <footer class="plate">
      <span>PORTATA 630 kg</span>
      <span class="plate__dot"></span>
      <span>8 PERSONE</span>
    </footer>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
